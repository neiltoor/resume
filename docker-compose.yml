version: '3.8'

services:

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /data/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    restart: unless-stopped
    networks:
      - web

  dns-updater:
    build: ./services/dns-updater
    environment:
      - GODADDY_API_KEY=${GODADDY_API_KEY}
      - GODADDY_API_SECRET=${GODADDY_API_SECRET}
      - GODADDY_DOMAIN=${GODADDY_DOMAIN}
      - GODADDY_RECORD_NAME=${GODADDY_RECORD_NAME:-@}
      - CHECK_INTERVAL=${DNS_CHECK_INTERVAL:-300}
    volumes:
      - /data/config.json:/data/config.json:ro
      - /data/godaddy-api/auth:/data/godaddy-api/auth:ro
    restart: unless-stopped
    networks:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  visitor-tracker:
    build: ./services/visitor-tracker
    volumes:
      - /data/auth:/data/auth:ro
      - /data/config.json:/data/config.json:ro
      - nginx_logs:/var/log/nginx:ro
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  nginx_logs:
