log_format json_access escape=json
  '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","path":"$request_uri","status":$status,"bytes":$bytes_sent,"ua":"$http_user_agent","ref":"$http_referer"}';

# HTTP - redirect to HTTPS
server {
    listen 80;
    server_name localhost neiltoor.com;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name localhost neiltoor.com;

    ssl_certificate /etc/nginx/certs/neiltoor_com.fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/neiltoor.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/access.log json_access;

    # Defer DNS resolution for visitor-tracker so nginx starts even if the
    # container isn't up yet.
    resolver 127.0.0.11 valid=10s;
    set $tracker_upstream http://visitor-tracker:8007;

    location /api/ {
        proxy_pass $tracker_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
